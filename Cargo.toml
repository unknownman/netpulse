[package]
name = "netpulse"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight, zero-flicker, terminal-based local network pulse tool"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
sysinfo = "0.31"
surge-ping = "0.8"
socket2 = "0.5"
netstat2 = "0.11"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
clap_complete = "4"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
